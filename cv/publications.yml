# ---------------------------------------------------------------
# PUBLICATIONS: newest first. Each entry lands in a section by `type`:
#   article   peer-reviewed journal article or book chapter
#   preprint  preprint, or a published evaluation of another paper
#   book      open textbook
#             (article, preprint, and book are listed together as
#             Academic Publications, newest first)
#   public    public-facing writing (op-eds, The Conversation, ...)
# Fields:
#   authors:  surnames in order, comma separated, e.g. "Harlow*, Jané*, Read, Chrobak"
#             "Jané" is bolded automatically. Add * after a surname for equal
#             contribution (explained once at the top of Publications).
#             Use "..." to skip authors in long lists.
#   year:     e.g. 2025
#   title:    title in sentence case
#   venue:    journal / book / outlet (set in italics automatically)
#   note:     optional plain text after the venue (e.g. "Living open-source textbook")
#   status:   optional, e.g. "Under review at *Meta-Psychology*"
#   doi:      bare DOI, e.g. "10.3389/frsle.2023.1082253" (optional)
#   url:      link to use when there is no DOI (optional)
#   links:    optional extra buttons, e.g. {label: PDF, url: ...}
# ---------------------------------------------------------------
entries:
